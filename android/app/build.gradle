plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// kotlin-stdlib comes from AGP 9 built in Kotlin; no version pinned here
def readProperties = { f ->
    def map = [:]
    if (f.exists()) {
        f.withReader('UTF-8') { reader ->
            reader.readLines().each { line ->
                if (line.contains('=')) {
                    def (key, value) = line.split('=', 2).collect { it != null ? it.trim() : '' }
                    map[key] = value
                }
            }
        }
    }
    return map
}

def localProperties = readProperties(rootProject.file('local.properties'))
def flutterVersionCode = localProperties['flutter.versionCode'] ?: '1'
def flutterVersionName = localProperties['flutter.versionName'] ?: '1.0'

def keystoreProperties = readProperties(rootProject.file('key.properties'))

android {

    // compileSdk and targetSdk are written out, not taken from flutter.*:
    // Flutter 3.47.2 still defaults both to 36 (FlutterExtension.kt:23,34) and
    // referencing it would move this app back a level.
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion   // 28.2.13676358 in Flutter 3.47.2
    namespace "nakajimamasao.appstudio.allowancetracker"

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "nakajimamasao.appstudio.allowancetracker"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core:1.19.0"
    implementation 'com.google.android.play:integrity:1.6.0'
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
