name: sweet_easy_pocket
description: helps_manage_your_allowance_easily
publish_to: 'none'
version: 1.0.10+10

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  cloud_firestore: ^6.9.0
  # App Check guards Cloud Firestore and Firebase Auth, which this app uses.
  # Analytics is not a protected product, so apps with only Analytics do not need it.
  firebase_app_check: ^0.4.7
  # Firebase Web (for generated_plugin_registrant)
  firebase_core_web: ^3.11.0
  firebase_auth_web: ^6.2.7
  firebase_analytics_web: ^0.6.1+13
  cloud_firestore_web: ^5.7.3
  # iOS icons
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  # Shared Preference
  shared_preferences: ^2.5.5
  shared_preferences_web: ^2.4.3
  # Floating Button
  flutter_speed_dial: ^7.0.0
  # Bar indicator
  percent_indicator: ^4.2.5
  # Graph
  fl_chart: ^1.2.0
  #env
  flutter_dotenv: ^6.0.1
  # Admob
  google_mobile_ads: ^9.1.0
  #MVVM
  hooks_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  #Splash
  flutter_native_splash: ^2.4.8
  # Localize
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# App Icon
flutter_icons:
  image_path: "assets/icon/ios_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/android_icon.png"

# App Splash
flutter_native_splash:
  image: "assets/icon/splash_icon.png"
  color: "#8040ff"
  fullscreen: true
  ios_content_mode: scaleAspectFit
  android_12:
    icon_background_color: "#8040ff"
    image: "assets/icon/splash_icon.png"

flutter:
  # Localize
  generate: true
  uses-material-design: true
  assets:
    - assets/.env
  fonts:
    - family: defaultFont
      fonts:
        - asset: assets/fonts/yasashisagothic.otf
    - family: enAccent
      fonts:
        - asset: assets/fonts/pacifico.ttf
    - family: jaAccent
      fonts:
        - asset: assets/fonts/riipopkkr.otf